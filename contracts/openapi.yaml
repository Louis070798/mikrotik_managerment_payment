                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: RECONCILIATION_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /ships/{shipId}/reconciliation/by-zone:
