          - NOT_AVAILABLE
        method:
          type: string
          enum:
          - RADIUS
          - NONE
        message:
          type: string
      description: States whether the system CAN identify a user/device for this zone at all — independent of whether data currently exists. CREW is always AVAILABLE (RADIUS); BUSINESS is NOT_AVAILABLE by default per SYSTEM_SPEC §4.3.
