openapi: 3.0.3
info:
  title: MikroTik Centralized Fleet Management API
  version: 1.20.0
  description: 'OpenAPI contract for Fleet Management API. v1.20.0 (2026-09-05): CrewUser them package/subscription_status/quota_used_bytes/expires_at -- gan goi cuoc that (subscribers.package_id) vao danh sach user CREW theo tung tau, truoc day chi co du lieu RADIUS session (byte/session), khong biet user dang dung goi nao. GET /ships/{shipId}/crew/users gio liet ke TAT CA subscriber gan voi thiet bi cua tau nay (ke ca chua tung ket noi RADIUS lan nao), khong chi nhung username da xuat hien trong radius_sessions. v1.19.0 (2026-09-05): them GET /dashboard/global/finance -- bao cao tai chinh toan ham doi tu packages.price_vnd + subscribers (KHONG phai doanh thu da thu, he thong chua co bang hoa don/thanh toan): tong gia tri cac goi dang ACTIVE, phan bo trang thai (active/suspended/expired), sap het han trong N ngay kem gia tri "at risk", breakdown theo goi/tau/dai ly. v1.18.0 (2026-09-05): them GET /dashboard/global/reconciliation -- gop cong thuc computeGap() dang co o cap tung tau len toan ham doi (tong byte WAN/CREW/BUSINESS/MANAGEMENT cong don qua tat ca tau cho "tong data", breakdown do lech tung tau sap theo |gap| giam dan cho "do lech"). Thay the trang Tong quan cu (chi dem inventory, traffic luon null) bang dashboard nay. v1.17.1 (2026-09-05): ZeroTierMember.online doi thanh 3 trang thai that (true/false/null) thay vi 2 -- null khi chua tung thay ket noi nao (khong du can cu), khac voi false (tung ket noi, hien khong active). v1.17.0 (2026-09-05): ZeroTierMember them name that (luu rieng bang zerotier_member_labels moi -- controller khong co field nay) va online that (suy tu GET /peer that, khong phai gia dinh). ZeroTierUpdateMemberRequest them name de dat/xoa ten. v1.16.0 (2026-09-05): RADIUS tu chi co Accounting thanh full Access+Accounting that -- them POST/DELETE /subscribers/{subscriberId}/password (cap/thu hoi mat khau RADIUS that qua scrypt, backend tu xac thuc Access-Request PAP, tra Mikrotik-Rate-Limit theo goi cuoc, kiem tra status/expires_at/quota that), Subscriber them password_configured/password_issued_at. Them POST /ships/{shipId}/crew/users/{username}/sessions/{sessionId}/disconnect -- CoA/Disconnect-Request that (RFC 5176) ngat phien tu router. v1.15.0 (2026-09-05): ZeroTier tu chi doc thanh full CRUD that qua Controller API -- them POST /zerotier/networks (tao network moi), GET/PATCH/DELETE /zerotier/networks/{networkId} (chi tiet IP pool/route/DNS/auto-assign, sua, xoa), PATCH/DELETE /zerotier/networks/{networkId}/members/{memberId} (cap phep/thu hoi/gan IP tay, xoa thanh vien). Sua mo ta ZeroTierMember.name cho dung thuc te (controller chuan khong co field nay, luon null). v1.14.0 (2026-09-04): them GET /zerotier/networks + GET /zerotier/networks/{networkId}/members -- proxy toi ZeroTier controller API that (dia chi/secret lay qua service_endpoints "zerotier.controller" + secret_ref, ADR-04/05, khong hard-code IP/token). v1.13.0 (2026-09-02): Ship them tenant_id (dai ly/cong ty quan ly tau, tuy chon). Device them radius_secret_configured/radius_secret_issued_at, va POST/DELETE /devices/{deviceId}/radius-secret -- sinh RADIUS secret that ngau nhien qua EnvSecretStore (TAM THOI, ADR-05), tu gan credential_ref, tra secret 1 lan duy nhat, doi xung voi push-key da co san. v1.12.0 (2026-09-02): CrewUsersResponse them billing_reconciliation (doi chieu tong byte NetFlow da gan username voi radius_sessions that -- muc do phu, khong tu co gian so). BusinessFlowsResponse them by_app/by_domain (SUM byte that theo dich vu/ten mien da phan loai qua DNS log collector) va mo rong enum classification_method them DNS -- bo phan loai DNS that (RADIUS Accounting UDP + NetFlow v9 UDP + DNS syslog UDP, xem service-catalog.ts/classifier.ts) thay the gia tri UNKNOWN cung ghi. v1.11.0 (2026-09-01): Device them router_config_text/router_config_updated_at -- luu nguyen van RouterOS config de tham khao tren tab Ket noi truc tiep (server khong bao gio tu thuc thi). Sua loi YAML anchor &id100 bi trung ten (ip_address doi thanh &deviceIpAddress) tung lam hong enum cua Subscriber.status. v1.10.0 (2026-09-01): DeviceTraffic them reconciliation (counted CREW+BUSINESS+MANAGEMENT + gap bytes/pct so voi WAN) -- doi soat tong data thuc te da len server qua push voi tong da gan nhan, cung cong thuc computeGap() da dung o Reconciliation cap tau. v1.9.0 (2026-09-01): DeviceInterfaceTraffic them latest_sample (counter tho gan nhat: rx/tx bytes cong don + packets/errors/drops) tren moi interface va last_push (identity MikroTik tu bao) o cap thiet bi -- hien thi day du nhung gi router thuc su gui len. v1.8.0 (2026-09-01): them GET /devices/{deviceId}/interfaces/traffic -- bandwidth + tong data theo TUNG interface rieng le (khac .../traffic chi gop theo 4 nhom), month_total reset tu nhien vao 00:00 UTC ngay 1 hang thang. v1.7.0 (2026-09-01): them ip_address/push_key_configured/push_key_issued_at tren Device, va POST/DELETE /devices/{deviceId}/push-key + POST /devices/{deviceId}/telemetry-push -- MikroTik tu day telemetry len server 1 chieu (khong luu mat khau router that, khong AuthStubGuard, xac thuc bang X-Device-Api-Key rieng cua thiet bi). v1.6.0 (2026-09-01): them GET /devices/{deviceId}/traffic (WAN total + rate theo bucket) va nas_device_id filter tren GET /subscribers. v1.5.0 (2026-09-01): them Tenant/Package/Subscriber (PPPoE/Hotspot) Phase 1 -- xem docs/backend/02-DATABASE_DESIGN.md Sec.1.6. v1.3.0 (2026-08-25): bo sung Phase 3 raw telemetry ingest, persistence, deduplication va health metadata. Additive-only, khong doi/xoa field cu.'
servers:
- url: /api/v1
paths:
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Unauthorized
  /auth/me:
    get:
      summary: Get user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
  /dashboard/global:
    get:
      summary: Global dashboard metrics
      tags:
      - Dashboard
      parameters:
      - $ref: '#/components/parameters/DashboardFrom'
      - $ref: '#/components/parameters/DashboardTo'
      - $ref: '#/components/parameters/DashboardTimezone'
      - $ref: '#/components/parameters/DashboardGranularity'
      - $ref: '#/components/parameters/DashboardZone'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalDashboardResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /dashboard/global/reconciliation:
    get:
      summary: Tong data + do lech (gap) toan ham doi
      description: Gop cung cong thuc computeGap() dang dung o cap tung tau (ships/{shipId}/reconciliation) len toan ham doi -- tong byte WAN + CREW/BUSINESS/MANAGEMENT cong don qua tat ca tau, va breakdown do lech tung tau sap theo |gap| giam dan. 422 neu hoan toan khong co interface_counter_deltas nao trong ca ham doi cho khoang thoi gian nay.
      tags:
      - Reconciliation
      parameters:
      - $ref: '#/components/parameters/DashboardFrom'
      - $ref: '#/components/parameters/DashboardTo'
      - $ref: '#/components/parameters/DashboardTimezone'
      - $ref: '#/components/parameters/DashboardGranularity'
      - $ref: '#/components/parameters/DashboardZone'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalReconciliationResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: RECONCILIATION_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /dashboard/global/finance:
    get:
      summary: Bao cao tai chinh toan ham doi
      description: 'Gia tri cac goi cuoc dang ACTIVE theo gia niem yet (packages.price_vnd) -- KHONG phai doanh thu da thu, he thong chua co bang hoa don/thanh toan. Gom: tong gia tri + so subscriber dang active, phan bo theo trang thai (active/suspended/expired), sap het han trong N ngay (co gia tri "at risk"), va breakdown theo goi/tau/dai ly (tenant).'
      tags:
      - Finance
      parameters:
      - $ref: '#/components/parameters/FinanceExpiringWithinDays'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalFinanceResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /telemetry/ingest:
    post:
      summary: Persist a batch of raw telemetry events
      description: Persists raw interface counters, RADIUS accounting or IPFIX flow events in the raw inbox. This endpoint does not claim that a RouterOS collector is connected and does not run analytics.
      tags:
      - Telemetry
      parameters:
      - in: header
        name: x-actor-permissions
        required: false
        description: Temporary AuthStubGuard permission header; production authentication is not implemented in this phase.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryIngestRequest'
      responses:
        '201':
          description: Events persisted or acknowledged as idempotent duplicates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryIngestResponse'
        '400':
          description: Invalid telemetry payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: TELEMETRY_IDENTITY_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /telemetry/health:
    get:
      summary: Raw telemetry ingest health
      description: Shows raw inbox persistence and last received time per source. UNKNOWN means no event has been ingested yet.
      tags:
      - Telemetry
      parameters:
      - in: header
        name: x-actor-permissions
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Telemetry persistence health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHealthResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /areas/{areaId}/dashboard:
    get:
      summary: Area dashboard metrics
      tags:
      - Dashboard
      parameters:
      - $ref: '#/components/parameters/AreaId'
      - $ref: '#/components/parameters/DashboardFrom'
      - $ref: '#/components/parameters/DashboardTo'
      - $ref: '#/components/parameters/DashboardTimezone'
      - $ref: '#/components/parameters/DashboardGranularity'
      - $ref: '#/components/parameters/DashboardZone'
      responses:
        '200':
          description: OK. Inventory is available even when telemetry is insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaDashboardResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: AREA_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /areas:
    get:
      summary: List areas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreasResponse'
        '403': &id002
          description: FORBIDDEN -- thieu permission (AuthStubGuard, header x-actor-permissions)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                  meta:
                    $ref: '#/components/schemas/BaseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetails'
      parameters:
      - in: header
        name: x-actor-permissions
        required: false
        description: TAM THOI (AuthStubGuard) -- CSV permission actor duoc cap. Thieu quyen bat buoc -> 403 FORBIDDEN.
        schema:
          type: string
    post:
      summary: Create area
      tags:
      - Inventory
      parameters:
      - &id001
        in: header
        name: x-actor-permissions
        required: false
        description: TAM THOI (AuthStubGuard, chua phai Auth/RBAC that) -- CSV permission actor duoc cap, vd 'inventory:read,inventory:write'. Thieu quyen bat buoc -> 403 FORBIDDEN.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AreaDetail'
                  meta:
                    $ref: '#/components/schemas/BaseMeta'
                  error:
                    allOf:
                    - $ref: '#/components/schemas/ErrorDetails'
                    nullable: true
              example: &id005
                data:
                  id: 10dbe648-f1ea-403e-9cf7-622dc9daf123
                  code: AREA-A
                  name: Khu vuc A
                  timezone: Asia/Bangkok
                  org_id: null
                  geo: null
                  ship_count: 1
                  created_at: '2026-08-25T01:09:19.786Z'
                  updated_at: '2026-08-25T01:09:19.786Z'
                meta:
                  request_id: req_01M0V7SBJE81P9J9TA1CHNWCWY
                  generated_at: '2026-08-25T01:09:19.786Z'
                error: null
        '400': &id003
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                  meta:
                    $ref: '#/components/schemas/BaseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetails'
        '403': &id004
          description: FORBIDDEN -- thieu permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                  meta:
                    $ref: '#/components/schemas/BaseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetails'
  /ships:
    get:
      summary: List ships
      parameters:
      - in: query
        name: area_id
        schema:
          type: string
      - *id001
      - in: query
        name: status
        schema:
          type: string
          enum: &id024
          - PLANNED
          - COMMISSIONING
          - ACTIVE
          - MAINTENANCE
          - DECOMMISSIONED
      - in: query
        name: q
        schema:
          type: string
        description: Tim theo ten (ILIKE)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipsResponse'
        '403': *id002
    post:
      summary: Create ship
      tags:
      - Inventory
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ShipDetail'
                  meta:
                    $ref: '#/components/schemas/BaseMeta'
                  error:
                    allOf:
                    - $ref: '#/components/schemas/ErrorDetails'
                    nullable: true
              example: &id007
                data:
                  id: c328fbf6-74f0-445d-9147-e60477a2ab2c
                  code: SHIP-1
                  name: MV Test
                  area_id: 10dbe648-f1ea-403e-9cf7-622dc9daf123
                  status: ACTIVE
                  timezone: UTC
                  imo: null
                  mmsi: null
                  crew_capacity: null
                  commissioned_at: null
                  device_count: 1
                  created_at: '2026-08-25T01:15:42.310Z'
                  updated_at: '2026-08-25T01:15:42.310Z'
                meta:
                  request_id: req_01M0V7SHTZQRZXNSVXTR7Y6GV6
                  generated_at: '2026-08-25T01:15:42.318Z'
                error: null
        '400': *id003
        '403': *id004
        '404':
          description: AREA_NOT_FOUND
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                  meta:
                    $ref: '#/components/schemas/BaseMeta'
                  error:
                    $ref: '#/components/schemas/ErrorDetails'
  /ships/{shipId}/dashboard:
    get:
      summary: Ship dashboard
      tags:
      - Dashboard
      parameters:
      - $ref: '#/components/parameters/ShipId'
      - $ref: '#/components/parameters/DashboardFrom'
      - $ref: '#/components/parameters/DashboardTo'
      - $ref: '#/components/parameters/DashboardTimezone'
      - $ref: '#/components/parameters/DashboardGranularity'
      - $ref: '#/components/parameters/DashboardZone'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipDashboardResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: SHIP_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /ships/{shipId}/reconciliation:
    get:
      summary: Ship data reconciliation summary
      tags:
      - Reconciliation
      parameters:
      - $ref: '#/components/parameters/ShipId'
      - $ref: '#/components/parameters/DashboardFrom'
      - $ref: '#/components/parameters/DashboardTo'
      - $ref: '#/components/parameters/DashboardTimezone'
      - $ref: '#/components/parameters/DashboardGranularity'
      - $ref: '#/components/parameters/DashboardZone'
      responses:
        '200':
          description: Reconciliation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: SHIP_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: RECONCILIATION_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /ships/{shipId}/reconciliation/by-wan:
