          $ref: '#/components/schemas/IdentityCapability'
        package:
          nullable: true
          description: Goi cuoc that cua subscriber tuong ung (subscribers.package_id) -- null neu username nay chi thay trong RADIUS session, khong co (hoac da xoa) subscriber tuong ung.
