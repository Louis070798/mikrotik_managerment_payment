                $ref: '#/components/schemas/ErrorEnvelope'
  /ships/{shipId}/reconciliation/timeseries:
    get:
      summary: Reconciliation gap time series
      tags:
      - Reconciliation
      parameters:
      - $ref: '#/components/parameters/ShipId'
      - $ref: '#/components/parameters/DashboardFrom'
