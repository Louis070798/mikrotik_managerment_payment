                download_bytes:
                  type: integer
                  nullable: true
                upload_bytes:
                  type: integer
                  nullable: true
            gap:
              type: object
              description: gap = wan - counted. Duong = con traffic WAN chua gan nhom; am (hiem) = counted vuot wan (vd loi dem 2 lan).
