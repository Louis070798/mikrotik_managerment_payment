services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleet_control_test}
      POSTGRES_USER: ${POSTGRES_USER:-fleet_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_dev_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - fleet_control_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  fleet_control_test_data:
