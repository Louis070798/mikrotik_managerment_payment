          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        service_usage:
          nullable: true
          description: Array of {app, bytes} summed from ipfix_flow_records for this user/period, DNS-classified (see classification_method) — only includes flows matched to a cataloged service. Empty array (not null) when the classifier is available but no classified traffic was found for this user; see service_usage_capability for the ship-level availability signal.
        domain_usage:
          nullable: true
          description: Array of {domain, bytes} (top 20 by bytes) summed from ipfix_flow_records for this user/period, for any DNS-resolved domain regardless of service catalog match. Empty array (not null) when the classifier is available but no classified traffic was found for this user.
