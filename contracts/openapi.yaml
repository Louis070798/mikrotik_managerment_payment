components:
  parameters:
    AreaId:
      in: path
      name: areaId
      required: true
      schema:
        type: string
        format: uuid
    ShipId:
      in: path
      name: shipId
      required: true
      schema:
        type: string
        format: uuid
    DashboardFrom:
      in: query
      name: from
      required: false
      schema:
        type: string
        format: date-time
      description: RFC3339 period start. Defaults to 24 hours before `to`.
    DashboardTo:
      in: query
      name: to
      required: false
      schema:
        type: string
        format: date-time
      description: RFC3339 period end. Defaults to now.
    DashboardTimezone:
      in: query
      name: timezone
      required: false
      schema:
        type: string
      description: IANA timezone used for period bucketing.
    DashboardGranularity:
      in: query
      name: granularity
      required: false
      schema:
        type: string
        enum:
        - 1m
        - 5m
        - 1h
        - 1d
        default: 1h
    DashboardZone:
      in: query
      name: zone
      required: false
      schema:
        type: string
        enum:
        - CREW
        - BUSINESS
        - MANAGEMENT
        - ALL
        default: ALL
    FinanceExpiringWithinDays:
      in: query
      name: expiring_within_days
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
      description: So ngay tinh tu bay gio de gom cac subscriber ACTIVE sap den expires_at vao "expiring_soon".
    RawLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    RawCursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
    RawSource:
      in: query
      name: source
      required: false
      schema:
        type: string
        enum:
        - INTERFACE_COUNTER
        - RADIUS_ACCOUNTING
        - IPFIX
        - DNS
        - SYSLOG
    RawReason:
      in: query
      name: reason
      required: false
      schema:
        type: string
    Username:
      in: path
      name: username
      required: true
      schema:
        type: string
  schemas:
    BaseMeta:
      type: object
      properties:
        request_id:
          type: string
        generated_at:
          type: string
          format: date-time
        data_from:
          type: string
          format: date-time
        data_to:
          type: string
          format: date-time
        data_freshness_seconds:
          type: integer
          nullable: true
        freshness_by_source:
          type: object
          additionalProperties:
            type: integer
            nullable: true
        page:
          type: object
          nullable: true
          description: Chi xuat hien tren cac endpoint list co phan trang (cursor hoac offset).
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
            cursor_next:
              type: string
              nullable: true
            has_more:
              type: boolean
        warnings:
          type: array
          nullable: true
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              details:
                type: object
                additionalProperties: true
    AuthSuccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
        meta:
          $ref: '#/components/schemas/BaseMeta'
        error:
          nullable: true
    MeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            role:
              type: string
        meta:
          $ref: '#/components/schemas/BaseMeta'
        error:
          nullable: true
    GlobalReconciliationZoneBytes:
      type: object
      properties:
        download_bytes:
          type: integer
          nullable: true
        upload_bytes:
          type: integer
          nullable: true
    GlobalReconciliationGaps:
      type: object
      properties:
        wan_download_gap_bytes:
          type: integer
          nullable: true
        wan_download_gap_pct:
          type: number
          nullable: true
        wan_upload_gap_bytes:
          type: integer
          nullable: true
        wan_upload_gap_pct:
          type: number
          nullable: true
        crew_download_gap_bytes:
          type: integer
          nullable: true
        crew_download_gap_pct:
          type: number
          nullable: true
        crew_upload_gap_bytes:
          type: integer
          nullable: true
        crew_upload_gap_pct:
          type: number
          nullable: true
    GlobalReconciliationShipRow:
      type: object
      description: 1 dong / tau, mang da sap san theo |wan_download_gap_pct| giam dan (tau lech nhieu nhat len dau).
      properties:
        ship_id:
          type: string
          format: uuid
        ship_code:
          type: string
        ship_name:
          type: string
        wan_download_bytes:
          type: integer
          nullable: true
        wan_upload_bytes:
          type: integer
          nullable: true
        counted_download_bytes:
          type: integer
          nullable: true
          description: Tong CREW+BUSINESS+MANAGEMENT download cua tau nay.
        counted_upload_bytes:
          type: integer
          nullable: true
        wan_download_gap_bytes:
          type: integer
          nullable: true
        wan_download_gap_pct:
          type: number
          nullable: true
        wan_upload_gap_bytes:
          type: integer
          nullable: true
        wan_upload_gap_pct:
          type: number
          nullable: true
    GlobalReconciliationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            period:
              $ref: '#/components/schemas/DashboardPeriod'
            units:
              $ref: '#/components/schemas/DashboardUnits'
            data_status:
              type: string
              enum:
              - AVAILABLE
            formula_version:
              type: string
            ship_count:
              type: integer
              description: So tau THAT SU co it nhat 1 dong interface_counter_deltas trong khoang thoi gian nay (khong phai tong so tau trong inventory).
            fleet:
              type: object
              properties:
                total_bytes:
                  type: integer
                  nullable: true
                  description: "\"Tong data\" toan ham doi = WAN download + upload cong lai cho ca ky."
                wan:
                  $ref: '#/components/schemas/GlobalReconciliationZoneBytes'
                crew:
                  type: object
                  properties:
                    port_download_bytes:
                      type: integer
                      nullable: true
                    port_upload_bytes:
                      type: integer
                      nullable: true
                    user_download_bytes:
                      type: integer
                      nullable: true
                    user_upload_bytes:
                      type: integer
                      nullable: true
                business:
                  $ref: '#/components/schemas/GlobalReconciliationZoneBytes'
                management:
                  $ref: '#/components/schemas/GlobalReconciliationZoneBytes'
                gaps:
                  $ref: '#/components/schemas/GlobalReconciliationGaps'
            ships:
              type: array
              items:
                $ref: '#/components/schemas/GlobalReconciliationShipRow'
        meta:
          $ref: '#/components/schemas/BaseMeta'
        error:
          nullable: true
    GlobalFinanceByPackageRow:
      type: object
      properties:
        package_id:
          type: string
          format: uuid
        package_name:
          type: string
        price_vnd:
          type: number
        active_subscriber_count:
          type: integer
        subtotal_vnd:
          type: number
    GlobalFinanceByShipRow:
      type: object
      properties:
        ship_id:
          type: string
          format: uuid
          nullable: true
          description: 'null = subscriber active chua duoc gan vao thiet bi/tau nao (nas_device_id null hoac tau da xoa).'
        ship_code:
          type: string
          nullable: true
        ship_name:
          type: string
          nullable: true
        active_subscriber_count:
          type: integer
        subtotal_vnd:
          type: number
    GlobalFinanceByTenantRow:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_code:
          type: string
        tenant_name:
          type: string
        active_subscriber_count:
          type: integer
        subtotal_vnd:
          type: number
    GlobalFinanceResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            as_of:
              type: string
              format: date-time
            currency:
              type: string
              enum:
              - VND
            totals:
              type: object
              properties:
                active_subscription_count:
                  type: integer
                active_subscription_value_vnd:
                  type: number
                  description: 'Tong gia_vnd cac goi dang ACTIVE theo gia niem yet -- KHONG phai doanh thu da thu (he thong chua luu hoa don/thanh toan).'
            status_breakdown:
              type: object
              properties:
                active:
                  type: integer
                suspended:
                  type: integer
                expired:
                  type: integer
            expiring_soon:
              type: object
              properties:
                within_days:
                  type: integer
                count:
                  type: integer
                at_risk_value_vnd:
                  type: number
            by_package:
              type: array
              items:
                $ref: '#/components/schemas/GlobalFinanceByPackageRow'
            by_ship:
              type: array
              items:
                $ref: '#/components/schemas/GlobalFinanceByShipRow'
            by_tenant:
              type: array
              items:
                $ref: '#/components/schemas/GlobalFinanceByTenantRow'
        meta:
          $ref: '#/components/schemas/BaseMeta'
        error:
          nullable: true
    GlobalDashboardResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            scope:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - GLOBAL
